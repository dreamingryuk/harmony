<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6f5" />
    <meta name="description" content="Descubra, compartilhe e converse sobre música no Harmony." />
    <script>
      (function () {
        // Aplica o tema salvo antes do React montar para evitar flash de tema errado.
        var ids = ['minimal-light', 'botanical', 'editorial', 'soft-pastel', 'neo-rutalism', 'midnight', 'oled-neon', 'warm-sunset', 'cyber-terminal', 'slate-professional'];
        var dark = ['midnight', 'oled-neon', 'warm-sunset', 'cyber-terminal', 'slate-professional'];
        var legacy = { dark: 'midnight', light: 'minimal-light', auto: 'minimal-light' };
        var stored = null;
        try { stored = localStorage.getItem('harmony-theme'); } catch (e) {}
        var theme = ids.indexOf(stored) !== -1 ? stored : legacy[stored] || 'minimal-light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.mode = dark.indexOf(theme) !== -1 ? 'dark' : 'light';
      })();
    </script>
    <title>Harmony — sua comunidade musical</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
